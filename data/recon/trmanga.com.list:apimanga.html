<!DOCTYPE html><html lang="tr"><head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Sayfa Bulunamadı | TRManga</title>

    <!-- SEO: 404 sayfaları indexlenmemeli -->
    <meta name="robots" content="noindex, nofollow">
    <meta name="description" content="Aradığınız sayfa bulunamadı. TRManga'da webtoon ve manga okumaya devam edin.">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- Google tag (gtag.js) -->
    <script async="" src="https://www.googletagmanager.com/gtag/js?id=G-E3ZGZR1HP6"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-E3ZGZR1HP6');
    </script>

    <style>
        body {
            background: url("/login.webp") no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
        }

        .error-box {
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            padding: 50px 40px;
            border-radius: 16px;
            backdrop-filter: blur(10px);
            max-width: 500px;
            width: 90%;
        }

        .error-code {
            font-size: 8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            margin-bottom: 10px;
        }

        .search-box {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            padding: 12px 20px;
            color: #fff;
            width: 100%;
            transition: all 0.3s ease;
        }

        .search-box:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.15);
            border-color: #667eea;
        }

        .search-box::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .btn-home {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            padding: 12px 30px;
            border-radius: 30px;
            color: #fff;
            font-weight: 600;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .btn-home:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
            color: #fff;
        }

        .quick-links a {
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .quick-links a:hover {
            color: #667eea;
        }

        .countdown {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.5);
        }
    </style>
</head>

<body>
    <div class="d-flex align-items-center justify-content-center vh-100">
        <div class="text-center error-box">
            <div class="error-code">404</div>
            <p class="fs-4 mb-2">
                <i class="fas fa-ghost me-2"></i>Sayfa Bulunamadı
            </p>
            <p class="text-white-50 mb-4">
                Aradığınız sayfa mevcut değil veya taşınmış olabilir.
            </p>

            <!-- Arama kutusu -->
            <form action="/webtoon-listesi" method="GET" class="mb-4">
                <div class="d-flex gap-2">
                    <input type="text" name="q" class="search-box" placeholder="Webtoon ara...">
                    <button type="submit" class="btn btn-home px-3">
                        <i class="fas fa-search"></i>
                    </button>
                </div>
            </form>

            <!-- Hızlı linkler -->
            <div class="quick-links mb-4">
                <a href="/" class="me-3"><i class="fas fa-home me-1"></i>Ana Sayfa</a>
                <a href="/son-eklenenler" class="me-3"><i class="fas fa-clock me-1"></i>Son Eklenenler</a>
                <a href="/webtoon-listesi"><i class="fas fa-list me-1"></i>Webtoon Listesi</a>
            </div>

            <a href="/" class="btn btn-home">
                <i class="fas fa-arrow-left me-2"></i>Ana Sayfaya Dön
            </a>

            <p class="countdown mt-4 mb-0">
                <i class="fas fa-clock me-1"></i><span id="timer">8</span> saniye sonra ana sayfaya
                yönlendirileceksiniz
            </p>
        </div>
    </div>

    <script>
        // Otomatik yönlendirme sayacı
        var seconds = 10;
        var timer = document.getElementById('timer');

        var countdown = setInterval(function () {
            seconds--;
            timer.textContent = seconds;

            if (seconds <= 0) {
                clearInterval(countdown);
                window.location.href = '/';
            }
        }, 1000);
    </script>

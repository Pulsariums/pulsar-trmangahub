name: 'Test sayfası (GitHub Pages)'

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Canlı test: kaynakları gerçek parser ile dene', 'Senkron: kaynakları güncelle']
    types: [completed]
  push:
    branches: [main]
    paths: ['scripts/build_pages.mjs', '.github/workflows/pages.yml']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build_pages.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

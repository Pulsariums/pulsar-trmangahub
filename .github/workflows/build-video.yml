name: Build Pulsar Video (Aniyomi eklentisi)

# Manga paketlerinden bağımsız: yalnız pulsar-video/extension derlenir.
# APK, depodaki imza anahtarıyla imzalanır; `pulsar video-repo` Aniyomi
# index.min.json'unu üretir ve artefaktlar main'e commit edilir.
on:
  workflow_dispatch:
    inputs:
      versionName:
        description: 'versionName (<extLib>.<patch>)'
        required: false
        default: '1.0.2'
      versionCode:
        description: 'versionCode'
        required: false
        default: '2'

permissions:
  contents: write

concurrency:
  group: build-video
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: pulsar-video-gradle-${{ hashFiles('pulsar-video/extension/**/*.kts') }}

      - name: Build video extension
        working-directory: pulsar-video/extension
        run: |
          gradle --no-daemon assembleRelease \
            -PpulsarVersionName="${{ inputs.versionName }}" \
            -PpulsarVersionCode="${{ inputs.versionCode }}"

      # İmzasız APK Aniyomi'ye kurulamaz: manga tarafıyla aynı depo anahtarı.
      - name: Sign release APK (committed key)
        run: |
          set -euo pipefail
          test -f signing/pulsar.keystore || { echo "::error::signing/pulsar.keystore yok"; exit 1; }
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          for apk in pulsar-video/extension/build/outputs/apk/release/*.apk; do
            "$APKSIGNER" sign --ks signing/pulsar.keystore --ks-key-alias pulsar \
              --ks-pass pass:pulsarmangahub --key-pass pass:pulsarmangahub "$apk"
            "$APKSIGNER" verify --print-certs "$apk" | head -5
          done

      - name: Build pulsar tool (video-repo)
        run: cargo build --release --manifest-path tools/pulsar/Cargo.toml

      - name: Generate Aniyomi repo (index + APK copies)
        run: ./tools/pulsar/target/release/pulsar video-repo

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pulsar-video-apk
          path: pulsar-video/extension/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Commit and push artifacts
        run: |
          git config user.name "pulsar-build-bot"
          git config user.email "noreply@pulsariums.dev"
          git add pulsar-video/repo
          git commit -m "build(video): aniyomi deposu (index + imzali APK)" || echo "degisiklik yok"
          # Başka bir koşu araya girerse: rebase et; APK/index çakışmasında
          # BU koşunun ürettiği dosyalar kalsın (rebase'te "theirs" = bizim commit).
          if ! git pull --rebase --autostash origin main; then
            echo "::warning::rebase çakıştı; üretilen depo korunuyor"
            git checkout --theirs -- pulsar-video/repo 2>/dev/null || true
            git add pulsar-video/repo
            GIT_EDITOR=true git rebase --continue || { git rebase --abort; exit 1; }
          fi
          git push origin HEAD:main

      - name: Verify published index
        run: |
          sleep 5
          base="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/pulsar-video/repo"
          # İki dosya, iki ayrı şema: index.min.json eklenti DİZİSİ,
          # repo.json Kototoro'nun ayrıştırdığı META NESNESİ.
          for f in index.min.json repo.json; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "$base/$f")
            echo "$f -> $code"
            test "$code" = "200" || { echo "::error::$f yayında değil ($code)"; exit 1; }
          done
          curl -fsS "$base/index.min.json" -o /tmp/pulsar-index.min.json
          curl -fsS "$base/repo.json" -o /tmp/pulsar-repo.json
          node -e '
            const fs = require("fs");
            const index = JSON.parse(fs.readFileSync("/tmp/pulsar-index.min.json", "utf8"));
            if (!Array.isArray(index)) throw new Error("index.min.json dizi değil");
            const meta = JSON.parse(fs.readFileSync("/tmp/pulsar-repo.json", "utf8"));
            if (!meta || typeof meta !== "object" || Array.isArray(meta)) throw new Error("repo.json nesne değil");
            if (!meta.meta || typeof meta.meta.name !== "string" || !meta.meta.name) throw new Error("repo.json meta.name yok");
            if (typeof meta.meta.website !== "string" || !meta.meta.website) throw new Error("repo.json meta.website yok");
            if (typeof meta.meta.signingKeyFingerprint !== "string" || !meta.meta.signingKeyFingerprint) throw new Error("repo.json signingKeyFingerprint yok");
            console.log("index.min.json dizi (" + index.length + " kayıt), repo.json meta.name=" + meta.meta.name);
          '

name: Mega video deposu (CloudStream + JAR + yerel Aniyomi eklentisi)

# CloudStream + JAR depolarını birleştirir; Aniyomi indeksine YALNIZ yerel
# eklentiyi yazar. Uzak Aniyomi depoları BİRLEŞTİRİLEMEZ: Kototoro `apk`
# alanını dosya adı kabul edip `<repo-kök>/apk/<apk>` indirir, uzak kayıtların
# mutlak apk URL'si 404 üretir (ExtensionRepoService.kt:421-422 ->
# ExtensionInstallService.kt:96-101).
#   repo/index.min.json  Aniyomi (yalnız yerel Pulsar Video eklentisi, göreli apk)
#   repo/repo.json       mevcut meta (korunur)
#   cs/repo.json         CloudStream mega depo (pluginLists)
#   cs/plugins.json      birleşik plugin dizisi (url mutlak)
#   jar/index.min.json   JAR indeksi (apk göreli: plugin.jar)
#   jar/apk/plugin.jar   JAR'ın kendisi (indirilir, ~1 MB)
#   mega-report.json     harici/atlanan kaynaklar
on:
  workflow_dispatch:
  schedule:
    # Her gece 02:23 UTC
    - cron: '23 2 * * *'

permissions:
  contents: write

concurrency:
  group: video-mega
  cancel-in-progress: false

jobs:
  mega:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build pulsar tool
        run: cargo build --release --manifest-path tools/pulsar/Cargo.toml

      - name: Depolari birlestir
        run: ./tools/pulsar/target/release/pulsar video-mega

      - name: Commit and push
        run: |
          git config user.name "pulsar-build-bot"
          git config user.email "noreply@pulsariums.dev"
          git add pulsar-video/repo/index.min.json pulsar-video/repo/repo.json \
                  pulsar-video/cs pulsar-video/jar pulsar-video/mega-report.json
          if git diff --cached --quiet; then
            echo "degisiklik yok"
            exit 0
          fi
          git commit -m "chore(mega): depo birlestirildi"
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - name: Yayini dogrula
        run: |
          base="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/pulsar-video"
          check() {
            for f in repo/index.min.json repo/repo.json cs/repo.json cs/plugins.json \
                     jar/index.min.json jar/apk/plugin.jar; do
              code=$(curl -sS -m 30 -o /dev/null -w '%{http_code}' "$base/$f")
              echo "$f -> $code"
              test "$code" = 200 || return 1
            done
            # Aniyomi indeksi YALNIZ yerel eklentiyi içerir: Kototoro `apk`
            # alanını dosya adı kabul edip `<repo-kök>/apk/<apk>` indirir.
            idx=$(curl -fsS -m 30 "$base/repo/index.min.json") || return 1
            n=$(printf '%s' "$idx" | jq 'length') || return 1
            apk=$(printf '%s' "$idx" | jq -r '.[0].apk // ""') || return 1
            src=$(printf '%s' "$idx" | jq '.[0].sources | length') || return 1
            echo "aniyomi kayit: $n, apk: $apk, sources: $src"
            test "$n" -eq 1 || { echo "::error::aniyomi indeksi 1 kayit olmali ($n)"; return 1; }
            case "$apk" in http*) echo "::error::apk goreli olmali: $apk"; return 1 ;; esac
            test "$src" -ge 40 || { echo "::error::sources eksik ($src)"; return 1; }
            code=$(curl -sS -m 30 -o /dev/null -w '%{http_code}' "$base/repo/apk/$apk")
            echo "kurulacak apk -> $code repo/apk/$apk"
            test "$code" = 200 || return 1

            lists=$(curl -fsS -m 30 "$base/cs/repo.json" | jq '.pluginLists | length') || return 1
            plugins=$(curl -fsS -m 30 "$base/cs/plugins.json" | jq 'length') || return 1
            echo "cs pluginLists: $lists, plugin: $plugins"
            test "$lists" -ge 10 -a "$plugins" -ge 100 || { echo "::error::cloudstream birlestirmesi kucuk"; return 1; }

            # JAR yerelleştirilmiş: apk göreli, dosya depoda duruyor.
            jar=$(curl -fsS -m 30 "$base/jar/index.min.json" | jq -r '.[0].apk') || return 1
            echo "jar apk: $jar"
            test "$jar" = "plugin.jar" || { echo "::error::jar apk goreli plugin.jar olmali: $jar"; return 1; }
            jar_size=$(curl -fsS -m 30 -o /dev/null -w '%{size_download}' "$base/jar/apk/plugin.jar") || return 1
            echo "jar boyut: $jar_size"
            test "$jar_size" -ge 100000 || { echo "::error::jar boyutu kucuk ($jar_size)"; return 1; }
          }
          for attempt in $(seq 1 12); do
            echo "deneme $attempt/12"
            if check; then exit 0; fi
            sleep 30
          done
          echo "::error::yayindaki mega dosyalari 12 denemede dogrulanamadi"
          exit 1

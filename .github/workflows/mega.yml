name: Mega video deposu (Aniyomi + CloudStream + JAR)

# Farklı depoları tek çatı altında birleştirir; APK indirmez, yalnız mutlak
# URL'ler üretir:
#   repo/index.min.json  Aniyomi (uzak 2 index + yerel Pulsar Video eklentisi)
#   repo/repo.json       mevcut meta (korunur)
#   cs/repo.json         CloudStream mega depo (pluginLists)
#   cs/plugins.json      birleşik plugin dizisi
#   jar/index.min.json   JAR indeksi (apk mutlak)
#   mega-report.json     atlanan kaynaklar
on:
  workflow_dispatch:
  schedule:
    # Her gece 02:23 UTC
    - cron: '23 2 * * *'

permissions:
  contents: write

concurrency:
  group: video-mega
  cancel-in-progress: false

jobs:
  mega:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build pulsar tool
        run: cargo build --release --manifest-path tools/pulsar/Cargo.toml

      - name: Depolari birlestir
        run: ./tools/pulsar/target/release/pulsar video-mega

      - name: Commit and push
        run: |
          git config user.name "pulsar-build-bot"
          git config user.email "noreply@pulsariums.dev"
          git add pulsar-video/repo/index.min.json pulsar-video/repo/repo.json \
                  pulsar-video/cs pulsar-video/jar pulsar-video/mega-report.json
          if git diff --cached --quiet; then
            echo "degisiklik yok"
            exit 0
          fi
          git commit -m "chore(mega): depo birlestirildi"
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - name: Yayini dogrula
        run: |
          base="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/pulsar-video"
          check() {
            for f in repo/index.min.json repo/repo.json cs/repo.json cs/plugins.json jar/index.min.json; do
              code=$(curl -sS -m 30 -o /dev/null -w '%{http_code}' "$base/$f")
              echo "$f -> $code"
              test "$code" = 200 || return 1
            done
            n=$(curl -fsS -m 30 "$base/repo/index.min.json" | jq 'length') || return 1
            echo "aniyomi kayit: $n"
            test "$n" -ge 200 || { echo "::error::aniyomi kayit sayisi dusuk ($n)"; return 1; }
            apk=$(curl -fsS -m 30 "$base/repo/index.min.json" \
                  | jq -r '[.[] | select(.apk | startswith("http"))][0].apk')
            test -n "$apk" -a "$apk" != "null" || { echo "::error::mutlak apk URL yok"; return 1; }
            code=$(curl -sS -m 30 -o /dev/null -w '%{http_code}' "$apk")
            echo "ornek apk -> $code $apk"
            test "$code" = 200 || return 1
            lists=$(curl -fsS -m 30 "$base/cs/repo.json" | jq '.pluginLists | length') || return 1
            plugins=$(curl -fsS -m 30 "$base/cs/plugins.json" | jq 'length') || return 1
            echo "cs pluginLists: $lists, plugin: $plugins"
            test "$lists" -ge 10 -a "$plugins" -ge 100 || { echo "::error::cloudstream birlestirmesi kucuk"; return 1; }
            jar=$(curl -fsS -m 30 "$base/jar/index.min.json" | jq -r '.[0].apk') || return 1
            case "$jar" in https://*) ;; *) echo "::error::jar apk mutlak degil: $jar"; return 1 ;; esac
            code=$(curl -sS -m 30 -o /dev/null -w '%{http_code}' "$jar")
            echo "jar apk -> $code $jar"
            test "$code" = 200 || return 1
          }
          for attempt in $(seq 1 12); do
            echo "deneme $attempt/12"
            if check; then exit 0; fi
            sleep 30
          done
          echo "::error::yayindaki mega dosyalari 12 denemede dogrulanamadi"
          exit 1

name: '1) Kaynak ekle (link → JAR → test → onar)'

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Manga sitesinin adresi (birden çok adres: boşlukla veya virgülle ayırın)'
        type: string
        required: true
      name:
        description: 'Kaynak adı (boş bırakılırsa domainden üretilir)'
        type: string
        required: false
        default: ''
      format:
        description: 'Üretilecek çıktı'
        type: choice
        options: ['both', 'jar', 'mihon']
        default: 'both'
      engine:
        description: 'Motor (auto: sitenin HTML parmak izinden tespit edilir)'
        type: choice
        options: ['auto', 'madara', 'mangathemesia', 'initmanga', 'custom', 'derin']
        default: 'auto'
      register:
        description: 'Depoya kaydet ve commit at'
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: hub
  cancel-in-progress: false

jobs:
  add-source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      parsers: ${{ steps.ids.outputs.parsers }}
    env:
      SITE_URL: ${{ inputs.url }}
      SITE_NAME: ${{ inputs.name }}
      SITE_FORMAT: ${{ inputs.format }}
      SITE_ENGINE: ${{ inputs.engine }}
      SITE_REGISTER: ${{ inputs.register }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Collect upstream sources
        run: python scripts/sync.py

      - name: Tarayıcı (derin analiz için)
        run: |
          npm init -y >/dev/null; npm i playwright@1.49.1 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Siteleri analiz et ve parser üret (bir veya birden çok adres)
        id: analyze
        run: |
          set +e
          urls=$(echo "$SITE_URL" | tr ',;' '  ' | tr -s '[:space:]' '\n' | grep -v '^$')
          n=$(echo "$urls" | wc -l)
          for u in $urls; do
            case "$u" in http*) ;; *) u="https://$u";; esac
            host=$(echo "$u" | sed -E 's#https?://##; s#/.*##; s#^www\.##')
            echo "== $host"
            eng="$SITE_ENGINE"; [ "$eng" = "derin" ] && eng=auto
            args=(--url "$u" --format "$SITE_FORMAT" --engine "$eng")
            if [ -n "$SITE_NAME" ] && [ "$n" = "1" ]; then args+=(--name "$SITE_NAME"); fi
            if [ "$SITE_REGISTER" = "true" ]; then args+=(--register 1); else args+=(--register 0); fi
            python scripts/analyze_site.py "${args[@]}" || echo "analiz başarısız: $host"
            verdict=$(jq -r '.verdict // .status // ""' data/analyze_result.json 2>/dev/null)
            if [ "$SITE_ENGINE" = "derin" ] || [ "$verdict" = "unsupported_engine" ]; then
              rm -rf recon-out; node scripts/recon.mjs "https://$host" >/dev/null 2>&1 || echo "recon hata verdi: $host"
              curl -s -m 60 "https://web.archive.org/cdx/search/cdx?url=$host/*&output=txt&fl=original&filter=statuscode:200&collapse=urlkey&limit=400" \
                | sed -E 's#https?://[^/]+##; s#\?.*##' | awk -F/ 'NF>2{print "/"$2"/"}' | sort | uniq -c | sort -rn | head -15 > "recon-out/$host.wayback.txt" 2>/dev/null
              if [ -f "recon-out/$host.spec.json" ]; then
                nsfw=0; [ "$(jq -r '.nsfw // false' data/analyze_result.json 2>/dev/null)" = "true" ] && nsfw=1
                gargs=("recon-out/$host.spec.json" --nsfw $nsfw)
                [ -n "$SITE_NAME" ] && [ "$n" = "1" ] && gargs+=(--name "$SITE_NAME")
                node scripts/genparser.mjs "${gargs[@]}" && echo "parser üretildi: $host"
              else
                echo "spec üretilemedi: $host"
              fi
              mkdir -p data/recon
              for f in recon-out/*; do case "$f" in *.html) head -c 300000 "$f" > "data/recon/$(basename "$f")";; *) cp "$f" data/recon/;; esac; done
            else
              echo "bilinen motor ($verdict), derin analiz atlandı"
            fi
          done
          exit 0

      - name: Run report
        if: always()
        run: python scripts/report.py add

      - name: Upload generated sources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated
          path: |
            generated/
            data/analyze_result.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit new source to the current branch
        if: inputs.register && steps.analyze.outcome == 'success'
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          domain="$(echo "$SITE_URL" | tr ',;' '  ' | awk '{print $1}')"; [ "$(echo "$SITE_URL" | tr ',;' '  ' | wc -w)" -gt 1 ] && domain="$domain ve diğerleri"
          git config user.name "pulsar-trmangahub-bot"
          git config user.email "pulsar-trmangahub-bot@users.noreply.github.com"
          if [ -d sources/custom ]; then git add sources/custom; fi
          if [ -d generated ]; then git add generated; fi
          if [ -d data/recon ]; then git add -f data/recon; fi
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore(add-source): ${domain} eklendi"
          for i in 1 2 3; do
            git pull --rebase origin "${BRANCH}" && git push origin "HEAD:${BRANCH}" && exit 0
            sleep $((i*5))
          done
          echo "Push başarısız oldu" >&2
          exit 1

      - name: Üretilen parser kimlikleri
        id: ids
        if: always()
        run: |
          ids=$(git diff --name-only "${{ github.sha }}" HEAD -- generated 2>/dev/null | grep '\.kt$' | while read f; do [ -f "$f" ] && grep -oE '@MangaSourceParser\("[A-Z0-9_]+"' "$f" | head -1 | sed -E 's/.*\("//; s/"//'; done | paste -sd, -)
          echo "parsers=$ids" >> "$GITHUB_OUTPUT"; echo "parser: $ids"

  test:
    needs: add-source
    if: ${{ needs.add-source.outputs.parsers != '' }}
    uses: ./.github/workflows/_test.yml
    with:
      bolum: hepsi
      only: ${{ needs.add-source.outputs.parsers }}

  onar:
    needs: [add-source, test]
    if: ${{ !cancelled() && needs.add-source.outputs.parsers != '' }}
    uses: ./.github/workflows/_onar.yml
    with:
      only: ${{ needs.add-source.outputs.parsers }}

  test2:
    needs: [add-source, onar]
    if: ${{ !cancelled() && needs.onar.outputs.fixed != '' }}
    uses: ./.github/workflows/_test.yml
    with:
      bolum: hepsi
      only: ${{ needs.onar.outputs.fixed }}

  jar:
    needs: [test, test2]
    if: ${{ !cancelled() && needs.test.result != 'skipped' }}
    uses: ./.github/workflows/_jar.yml
    with:
      bolum: hepsi

  pages:
    needs: jar
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/_pages.yml

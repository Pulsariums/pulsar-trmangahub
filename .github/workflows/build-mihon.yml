name: 'Mihon deposu: Türkçe APK aynası (turkce/mihon)'

on:
  schedule:
    - cron: '27 */6 * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Aynayı turkce/mihon klasörüne commit edip gönder'
        type: boolean
        default: true
      include_unverified:
        description: 'cf_protected, failing ve doğrulanamamış kaynakları da dahil et (varsayılan: yalnızca çalışanlar)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sync-tr-sources
  cancel-in-progress: false

jobs:
  mihon:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PUBLISH: ${{ inputs.publish || github.event_name == 'schedule' }}
      INCLUDE_UNVERIFIED: ${{ inputs.include_unverified && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 'Türkçe Mihon APK''lerini aynala'
        run: |
          ARGS=""
          if [ "$INCLUDE_UNVERIFIED" = "1" ]; then ARGS="--include-unverified"; fi
          python3 -I scripts/mihon_publish.py $ARGS

      - name: Mihon klasörünü dala gönder
        if: env.PUBLISH == 'true'
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git add turkce/mihon
          if git diff --cached --quiet; then
            echo "Değişiklik yok, commit atılmadı."
            exit 0
          fi
          git -c user.name=pulsarium -c user.email=pulsariums@gmail.com commit -m "chore(mihon): Türkçe Mihon deposu güncellendi"
          for i in 1 2 3; do
            git pull --rebase origin "${BRANCH}" && git push origin "HEAD:${BRANCH}" && exit 0
            sleep $((i*5))
          done
          echo "Push başarısız oldu" >&2
          exit 1

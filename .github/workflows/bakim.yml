name: '2) Tam otomatik bakım (tek tuş)'

# Elle başlatılır; gerisini kendi yapar:
# senkron -> yeni alan adı keşfi -> tüm JAR'ları canlı test -> kırılanları onar -> yeniden test
# -> JAR derle/yayınla -> Mihon aynası -> pano (Pages). Silme yok, ölüler karantinaya.

on:
  workflow_dispatch:
    inputs:
      max_stems:
        description: 'Taranacak en fazla kaynak adı kökü'
        type: string
        default: '80'
      kapsam:
        description: 'Senkron kapsamı: tr = yalnız Türkçe (hızlı), hepsi = global dahil (yavaş)'
        type: choice
        options: [tr, hepsi]
        default: tr
      kesif:
        description: 'Ölü kaynaklar için yeni alan adı ara'
        type: boolean
        default: true

permissions:
  contents: write
  actions: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: hub
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  UA: 'Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/124.0 Mobile Safari/537.36'

jobs:
  sync:
    uses: ./.github/workflows/_sync.yml
    with:
      kapsam: ${{ inputs.kapsam }}

  bakim:
    needs: sync
    if: ${{ !cancelled() && inputs.kesif }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bağımlılıklar
        run: pip install requests

      - name: Aday adları çıkar (karantina + ölü kayıtlar)
        run: |
          jq -r '(if type=="array" then . else .sources end)
                 | map(select(.status=="quarantined" or .status=="unverified"))
                 | .[] | [(.domain|split(".")[0]), (.name // "")] | @tsv' sources/tr/sources.json \
            | awk -F'\t' '{print tolower($1); n=tolower($2); gsub(/[^a-z0-9]/,"",n); if (n!="") print n}' \
            | awk 'length($0)>=4' | sort -u | head -n "${{ inputs.max_stems }}" > stems.txt
          echo "kök sayısı: $(wc -l < stems.txt)"

      - name: Alan adı keşfi (DoH + canlı doğrulama)
        run: |
          set +e
          TLDS="com net org com.tr net.tr org.tr info biz xyz club live fun pro app cc io ink art cyou icu vip one lol my tv wtf space store tech website click link today cloud life world shop ws site online co top me us in tr ru de cx pw mobi page dev blog win wiki rest sbs cfd bond buzz monster quest uno ltd"
          for s in $(cat stems.txt); do for t in $TLDS; do echo "$s.$t"; done; done > cand.txt
          echo "aday: $(wc -l < cand.txt)"
          resolve() { d=$1; r=$(curl -s -m 8 "https://dns.google/resolve?name=$d&type=A" | jq -r '[.Answer[]?|select(.type==1)|.data]|first // empty'); [ -n "$r" ] && echo "$d"; }
          export -f resolve
          xargs -a cand.txt -P 24 -I{} bash -c 'resolve {}' > resolved.txt
          echo "çözülen: $(wc -l < resolved.txt)"
          # Zaten kayıtlı alan adlarını ele
          jq -r '(if type=="array" then . else .sources end)|.[].domain' sources/tr/sources.json | sort -u > known.txt
          jq -r '.[].domain' sources/custom/sources.json 2>/dev/null >> known.txt
          sort -u known.txt -o known.txt
          BAD='bahis|casino|slot|judi|kumar|porn|for sale|parked|domain.*sat|satılık|satilik|betting|poker'
          : > accepted.txt
          while read d; do
            grep -qx "$d" known.txt && continue
            out=$(curl -sS -L -m 15 -A "$UA" -o b.html -w '%{http_code} %{url_effective}' "https://$d/" 2>/dev/null | tr '\n' ' ')
            code=${out%% *}; [ "$code" = "200" ] || continue
            final=$(echo "$out" | awk '{print $2}' | sed -E 's#https?://([^/]+).*#\1#; s#^www\.##')
            [ "$final" = "${d#www.}" ] || continue
            title=$(grep -oi '<title>[^<]*' b.html | head -1 | cut -c8-120)
            [ -n "$title" ] || continue
            echo "$title $final" | grep -qiE "$BAD" && continue
            stem=${d%%.*}
            tn=$(echo "$title" | tr 'A-Z' 'a-z' | tr -cd 'a-z0-9')
            echo "$tn" | grep -q "$stem" || continue
            grep -qiE 'manga|webtoon|manhwa|bölüm|bolum|chapter|çizgi roman' b.html || continue
            # Türkçe site olmalı: html lang=tr veya Türkçe harf/kelime yoğunluğu
            grep -qiE '<html[^>]*lang="?tr|türkçe|bölüm|okumaya|seriler|güncel' b.html || continue
            [ "$(grep -oE '[ığşçöüİĞŞÇÖÜ]' b.html | wc -l)" -ge 30 ] || continue
            cf=$(grep -ci 'just a moment\|cf-mitigated\|challenge-platform' b.html)
            echo "$d" >> accepted.txt
            echo "KABUL $d | $title | cf=$cf"
          done < resolved.txt
          echo "kabul edilen: $(wc -l < accepted.txt)"

      - name: Kabul edilenleri kayda al ve parser üret
        run: |
          set +e
          if [ ! -s accepted.txt ]; then echo "kabul edilen yok"; exit 0; fi
          git config user.name "pulsar-trmangahub-bot"
          git config user.email "pulsar-trmangahub-bot@users.noreply.github.com"
          npm init -y >/dev/null; npm i playwright@1.49.1 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          register_all() {
            python scripts/sync.py >/dev/null
            while read d; do
              echo "== $d"
              python scripts/analyze_site.py --url "https://$d" --format jar --engine auto --register 1 || { echo "analiz başarısız: $d"; continue; }
              verdict=$(jq -r '.verdict // ""' data/analyze_result.json)
              if [ "$verdict" = "unsupported_engine" ]; then
                echo "bilinen motor yok: derin analiz"
                rm -rf recon-out; node scripts/recon.mjs "https://$d" >/dev/null 2>&1
                if [ -f "recon-out/$d.spec.json" ]; then
                  node scripts/genparser.mjs "recon-out/$d.spec.json" && echo "parser üretildi: $d"
                  mkdir -p data/recon
                  for f in recon-out/*; do case "$f" in *.html) head -c 300000 "$f" > "data/recon/$(basename "$f")";; *) cp "$f" data/recon/;; esac; done
                else
                  echo "spec üretilemedi: $d"
                fi
              fi
            done < accepted.txt
          }
          for i in 1 2 3; do
            git fetch -q origin "${{ github.ref_name }}" && git reset -q --hard "origin/${{ github.ref_name }}"
            register_all
            [ -d sources/custom ] && git add sources/custom
            [ -d generated ] && git add generated
            [ -d data/recon ] && git add -f data/recon
            if git diff --cached --quiet; then echo "yeni kayıt yok"; exit 0; fi
            git commit -qm "chore(bakim): keşfedilen yeni alan adları eklendi"
            git push -q origin "HEAD:${{ github.ref_name }}" && { echo "kayıtlar gönderildi"; exit 0; }
            echo "push çakıştı, yeniden deneniyor ($i)"; sleep $((i*5))
          done
          exit 1

      - name: Özet
        if: always()
        run: |
          {
            echo "## Bakım özeti"
            echo "- taranan kök: $(wc -l < stems.txt 2>/dev/null)"
            echo "- çözülen alan adı: $(wc -l < resolved.txt 2>/dev/null)"
            echo "- yeni kabul edilen: $(wc -l < accepted.txt 2>/dev/null)"
            sed 's/^/  - /' accepted.txt 2>/dev/null
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    needs: [sync, bakim]
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/_test.yml
    with:
      bolum: hepsi

  onar:
    needs: test
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/_onar.yml

  test2:
    needs: onar
    if: ${{ !cancelled() && needs.onar.outputs.fixed != '' }}
    uses: ./.github/workflows/_test.yml
    with:
      bolum: hepsi
      only: ${{ needs.onar.outputs.fixed }}

  jar:
    needs: [test, test2]
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/_jar.yml
    with:
      bolum: hepsi

  mihon:
    needs: jar
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/_mihon.yml

  pages:
    needs: mihon
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/_pages.yml

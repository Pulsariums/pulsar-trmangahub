name: 'Senkron: kaynakları güncelle (turkce ve global)'

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Commit atma, sadece raporla'
        type: boolean
        default: false
      fail_threshold:
        description: 'Karantina için ardışık hata eşiği'
        type: choice
        options: ['1', '2', '3', '5']
        default: '3'
      safety_ratio:
        description: 'Güvenlik şalteri oranı (yüzde) veya off'
        type: choice
        options: ['40', '60', '80', 'off']
        default: '40'
      run_alternatives:
        description: 'Ölü domainler için alternatif ara'
        type: boolean
        default: true
      refresh_kotatsu:
        description: 'Kotatsu klonunu sil ve yeniden klonla'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-tr-sources
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DRY_RUN: ${{ inputs.dry_run || false }}
      FAIL_THRESHOLD: ${{ inputs.fail_threshold || '3' }}
      SAFETY_RATIO: ${{ inputs.safety_ratio || '40' }}
      RUN_ALTERNATIVES: ${{ github.event_name == 'schedule' || inputs.run_alternatives }}
      REFRESH_KOTATSU: ${{ inputs.refresh_kotatsu || false }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Collect upstream sources
        run: |
          if [ "$REFRESH_KOTATSU" = "true" ]; then
            python scripts/sync.py --refresh-kotatsu
          else
            python scripts/sync.py
          fi

      - name: Probe domains
        run: python scripts/probe.py

      - name: Find alternatives for broken domains
        if: env.RUN_ALTERNATIVES == 'true'
        run: python scripts/alternatives.py

      - name: Build published lists (safety switch, per bucket)
        id: build
        run: |
          set +e
          python scripts/build.py
          rc=$?
          set -e
          if [ "$rc" -eq 2 ]; then
            echo "cancelled=true" >> "$GITHUB_OUTPUT"
            exit 0
          elif [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi
          echo "cancelled=false" >> "$GITHUB_OUTPUT"

      - name: Run report
        if: always()
        env:
          CANCELLED: ${{ steps.build.outputs.cancelled }}
        run: python scripts/report.py sync

      - name: Commit changes to the current branch
        if: steps.build.outputs.cancelled == 'false' && env.DRY_RUN != 'true'
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "pulsar-trmangahub-bot"
          git config user.email "pulsar-trmangahub-bot@users.noreply.github.com"
          git add sources/tr sources/global
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore(sync): TR kaynakları güncellendi"
          for i in 1 2 3; do
            git pull --rebase origin "${BRANCH}" && git push origin "HEAD:${BRANCH}" && exit 0
            sleep $((i*5))
          done
          echo "Push başarısız oldu" >&2
          exit 1

      - name: Open issue when the sync was cancelled
        if: steps.build.outputs.cancelled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          title="Senkron iptal edildi"
          existing=$(gh issue list --state open --json title,number \
            -q ".[] | select(.title==\"${title}\") | .number" | head -n 1)
          if [ -n "$existing" ]; then
            echo "Open issue #${existing} already exists; not creating another."
            exit 0
          fi
          gh issue create --title "$title" --body "Güvenlik şalteri devreye girdi: bölüm yayını (turkce veya global) bu run'da iptal edildi ve hiçbir dosya değiştirilmedi. Nedeni için bu workflow run'ının build adımındaki IPTAL satırına bakın. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Upload sync data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-data
          path: |
            data/probe_results.json
            data/upstream_tr.json
          retention-days: 7
          if-no-files-found: ignore

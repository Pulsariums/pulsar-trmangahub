name: 'lunar-probe (gecici)'
on:
  workflow_dispatch:
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          UA='Mozilla/5.0 (Linux; Android 14) Chrome/124.0 Mobile Safari/537.36'
          B=https://api.lunarx.to/api/manga
          for s in what-we-shouldn-t the-cliff weak-hero; do
            img=$(curl -s -A "$UA" "$B/$s/1" | jq -r '.data.images[0]')
            echo "IMG $s $img"
            for ref in "" "https://lunarx.to/" "https://www.lunarx.to/" "https://lunarx.to/manga/$s/1"; do
              c=$(curl -s -A "$UA" ${ref:+-e "$ref"} -o /dev/null -w '%{http_code}' "$img")
              o=$(curl -s -A "$UA" ${ref:+-H "Origin: https://lunarx.to"} ${ref:+-e "$ref"} -o /dev/null -w '%{http_code}' "$img")
              echo "RES ref=[$ref] noOrigin=$c origin=$o"
            done
          done
          echo done

name: 'lunar-probe (gecici)'
on:
  workflow_dispatch:
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          UA='Mozilla/5.0 (Linux; Android 14) Chrome/124.0 Mobile Safari/537.36'
          curl -s -L -A "$UA" https://lunarx.to/manga/the-cliff/1 -o p.html
          for c in $(grep -oE '/_next/static/chunks/[A-Za-z0-9_.~-]+\.js' p.html | sort -u); do
            curl -s -A "$UA" "https://lunarx.to$c" -o c.js
            if grep -q 'session_data' c.js; then
              echo "RES chunk $c"
              grep -oE '.{250}session_data.{350}' c.js | head -4 | sed 's/^/RES ctx: /'
            fi
          done
          echo "RES done"

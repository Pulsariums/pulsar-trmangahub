name: Verify Signing Fingerprint

# Bu iş akışı HİÇBİR ŞEY imzalamaz, üretmez veya commit etmez.
# Tek işi: imza anahtarı ile yayındaki repo.json parmak izi ve depodaki APK'lar
# birbirini tutuyor mu, onu denetlemek.
#
# Neden ayrı: imzalama zaten build-extension.yml içinde yapılıyor; ayrıca ikinci
# bir imzalama akışı iki farklı çıktı üretme riski taşıyordu. Kototoro/Mihon
# parmak izi eşleşmezse eklenti "Untrusted" olur.

on:
  workflow_dispatch:
  push:
    paths:
      - 'signing/pulsar.keystore'
      - 'repo.json'
      - 'pulsar-v2/repo/repo.json'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate preinstalled Android SDK
        run: |
          ANDROID_HOME="/usr/local/lib/android/sdk"
          [ -d "$ANDROID_HOME" ] || ANDROID_HOME="$ANDROID_SDK_ROOT"
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)"
          [ -n "$APKSIGNER" ] || { echo "::error::apksigner bulunamadi"; exit 1; }
          echo "APKSIGNER=$APKSIGNER" >> "$GITHUB_ENV"
          echo "apksigner: $APKSIGNER"

      - name: Keystore certificate fingerprint
        run: |
          test -f signing/pulsar.keystore || { echo "::error::signing/pulsar.keystore yok"; exit 1; }
          FP="$(keytool -exportcert -alias pulsar \
                  -keystore signing/pulsar.keystore \
                  -storepass pulsarmangahub 2>/dev/null | sha256sum | cut -d' ' -f1)"
          [ -n "$FP" ] || { echo "::error::Anahtardan sertifika okunamadi"; exit 1; }
          echo "KEYSTORE_FP=$FP" >> "$GITHUB_ENV"
          echo "Anahtar sertifikasi SHA-256: $FP"

      - name: Compare with published repo.json
        run: |
          fail=0
          for f in repo.json pulsar-v2/repo/repo.json; do
            [ -f "$f" ] || { echo "::warning::$f yok, atlandi"; continue; }
            got="$(grep -oE '"[0-9a-f]{64}"' "$f" | head -1 | tr -d '"')"
            if [ "$got" != "$KEYSTORE_FP" ]; then
              echo "::error file=$f::$f parmak izi anahtarla uyusmuyor (repo=$got anahtar=$KEYSTORE_FP)"
              fail=1
            else
              echo "OK $f -> $got"
            fi
          done
          [ "$fail" -eq 0 ] || exit 1

      - name: Compare with APKs in repository
        run: |
          shopt -s nullglob
          apks=(pulsar-v2/repo/apk/*.apk)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "::warning::Depoda APK yok, imza karsilastirmasi atlandi"
            exit 0
          fi
          fail=0
          for apk in "${apks[@]}"; do
            fp="$("$APKSIGNER" verify --print-certs "$apk" \
                  | grep -i 'SHA-256' | head -1 | grep -oE '[0-9a-f]{64}')"
            if [ "$fp" != "$KEYSTORE_FP" ]; then
              echo "::error file=$apk::$apk imzasi anahtarla uyusmuyor (apk=$fp anahtar=$KEYSTORE_FP)"
              fail=1
            else
              echo "OK $apk"
            fi
          done
          [ "$fail" -eq 0 ] || exit 1

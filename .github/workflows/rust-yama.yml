name: 'rust-yama (gecici)'
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  y:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Yama
        run: |
          set -e
          S=tools/pulsar/src/status.rs
          # A) cihaz "pass" -> aktif
          perl -0pi -e 's/(    let step = e\.device_step\.as_deref\(\)\.unwrap_or\(""\);\n)/$1    if device == "pass" {\n        e.state = "active".to_string();\n        return;\n    }\n/' $S
          # B) aktif olmayan her kaynak (olu degil) tamir paketinde test edilir
          perl -0pi -e 's/(        recompute_state\(s\);\n)(    \}\n    \/\/ Katalogdan)/$1        if !s.dead \&\& sorun.is_empty() \&\& s.state != "active" {\n            s.packages = vec!["tamir".to_string()];\n        }\n$2/' $S
          # C) tam testte raporda olmayan, yayinda olan kaynak = gecti
          perl -0pi -e 's/            if v\.device\.is_some\(\) && !seen_ids\.contains\(k\) \{\n                v\.device = None;/            if !seen_ids.contains(k) \&\& (v.device.is_some() || !v.packages.is_empty()) {\n                v.device = if v.packages.is_empty() {\n                    None\n                } else {\n                    Some(Probe { status: "pass".to_string(), http_code: String::new(), ms: 0, detail: String::new(), at: at.clone() })\n                };/' $S
          git diff --stat
          git diff | grep -E '^[+-]' | grep -v '^+++\|^---' | head -40
          git config user.name pulsarium
          git config user.email pulsariums@gmail.com
          git diff --quiet && { echo 'degisiklik yok'; exit 1; }
          git commit -qam "feat(durum): aktif olmayan her kaynak tamir paketinde cihazda test edilir; cihaz gecti = aktif"
          git pull -q --rebase origin main && git push -q origin main

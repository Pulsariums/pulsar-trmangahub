name: 'iç: otomatik onarım'

# Canlı testte kırılan üretilmiş parser'lar için siteyi yeniden analiz eder,
# parser'ı yeniden üretir ve onarılanları çıktı olarak verir (test çağıran tarafta).
# Ölü/taşınmış alan adı (dns, http_gone) için kayıttaki canlı benzer kaynağa bakar.

on:
  workflow_call:
    inputs:
      only:
        type: string
        default: ''
    outputs:
      fixed:
        value: ${{ jobs.onar.outputs.fixed }}

permissions:
  contents: write

jobs:
  onar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      fixed: ${{ steps.r.outputs.fixed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright
        run: |
          npm init -y >/dev/null; npm i playwright@1.49.1 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Onar
        id: r
        run: |
          set +e
          for k in generated/*/jar/*.kt; do
            [ -f "$k" ] || continue
            id=$(grep -oE '@MangaSourceParser\("[A-Z0-9_]+"' "$k" | head -1 | sed -E 's/.*\("//; s/"//')
            [ -n "$id" ] && echo "$id $(echo "$k" | cut -d/ -f2)"
          done > map.txt
          jq -r 'to_entries[]|select((.value.ok_streak//0)==0 and ((.value.error_class//"")|IN("http_gone","parse","empty","http","decode")))|.key' data/live/history.json > want.txt
          if [ -n "${{ inputs.only }}" ]; then
            echo "${{ inputs.only }}" | tr ',' '\n' | sed 's/ //g' | grep -v '^$' > only.txt
            grep -Fxf only.txt want.txt > w2.txt; mv w2.txt want.txt
          fi
          echo "## Onarım" >> "$GITHUB_STEP_SUMMARY"
          : > fixed.txt
          while read p; do
            d=$(awk -v p="$p" '$1==p{print $2}' map.txt)
            [ -n "$d" ] || continue
            echo "== $p ($d)"
            nsfw=$(jq -r --arg d "$d" '.[]|select(.domain==$d)|if (.nsfw==true) then 1 else 0 end' sources/custom/sources.json | head -1)
            rm -rf recon-out; node scripts/recon.mjs "https://$d" > recon.log 2>&1
            if [ -f "recon-out/$d.spec.json" ]; then
              cp generated/$d/jar/*.kt /tmp/old.kt
              node scripts/genparser.mjs "recon-out/$d.spec.json" --nsfw "${nsfw:-0}" >/dev/null
              mkdir -p data/recon; cp recon-out/*.spec.json data/recon/ 2>/dev/null
              if cmp -s /tmp/old.kt generated/$d/jar/*.kt; then
                echo "- $p: yeniden analiz aynı sonucu verdi (site yapısı spec ile uyumsuz)" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "$p" >> fixed.txt; echo "- $p: parser yeniden üretildi" >> "$GITHUB_STEP_SUMMARY"
              fi
            else
              echo "- $p: site analiz edilemedi ($(tail -1 recon.log | cut -c1-120))" >> "$GITHUB_STEP_SUMMARY"
            fi
          done < want.txt
          git config user.name "pulsar-trmangahub-bot"
          git config user.email "pulsar-trmangahub-bot@users.noreply.github.com"
          git add generated sources/custom; git add -f data/recon 2>/dev/null
          if ! git diff --cached --quiet; then
            git commit -qm "fix(onar): başarısız parser'lar yeniden üretildi"
            for i in 1 2 3; do git pull -q --rebase origin "${{ github.ref_name }}" && git push -q origin "HEAD:${{ github.ref_name }}" && break; sleep $((i*5)); done
          fi
          echo "fixed=$(paste -sd, fixed.txt)" >> "$GITHUB_OUTPUT"

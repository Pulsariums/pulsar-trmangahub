name: 'Jar derle: Kototoro JAR depoları (turkce, global, ozel)'

on:
  schedule:
    - cron: '47 */6 * * *'
  workflow_dispatch:
    inputs:
      bolum:
        description: 'Derlenecek bölüm: turkce (yalnız Türkçe), global (tüm diller), ozel (Kaynak ekle parser''ları) veya hepsi'
        type: choice
        options: [hepsi, turkce, global, ozel]
        default: hepsi
      mode:
        description: 'Seçim modu: alive (yayındaki/çalışan) veya all_tr (tüm TR kaynaklar; yalnız turkce için anlamlı)'
        type: choice
        options: ['alive', 'all_tr']
        default: 'alive'
      include_broken:
        description: 'Bozuk (broken) kaynakları da dahil et'
        type: boolean
        default: false
      apply_alternatives:
        description: 'Alternatif domain yaması güven seviyesi'
        type: choice
        options: ['off', 'high', 'high_medium']
        default: 'high'
      include_unverified:
        description: 'cf_protected, failing ve doğrulanamamış kaynakları da dahil et (varsayılan: yalnızca çalışanlar)'
        type: boolean
        default: false
      force:
        description: 'Parmak izi aynı olsa da derle'
        type: boolean
        default: false
      publish:
        description: 'Derlemeyi ilgili bölüm klasöründe commit edip gönder'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: sync-tr-sources
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      buckets: ${{ steps.plan.outputs.buckets }}
    steps:
      - name: Bölüm listesini çıkar
        id: plan
        env:
          BOLUM: ${{ inputs.bolum || 'hepsi' }}
        run: |
          case "$BOLUM" in
            hepsi) list='["turkce","global","ozel"]' ;;
            turkce|global|ozel) list="[\"$BOLUM\"]" ;;
            *) echo "::error::Bilinmeyen bölüm: $BOLUM"; exit 1 ;;
          esac
          echo "buckets=$list" >> "$GITHUB_OUTPUT"

  jar:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        bucket: ${{ fromJSON(needs.plan.outputs.buckets) }}
    env:
      BUCKET: ${{ matrix.bucket }}
      MODE: ${{ inputs.mode || 'alive' }}
      INCLUDE_BROKEN: ${{ inputs.include_broken && '1' || '0' }}
      APPLY_ALTERNATIVES: ${{ inputs.apply_alternatives || 'high' }}
      INCLUDE_UNVERIFIED: ${{ inputs.include_unverified && '1' || '0' }}
      FORCE: ${{ inputs.force && '1' || '0' }}
      PUBLISH: ${{ inputs.publish || github.event_name == 'schedule' }}
    steps:
      - uses: actions/checkout@v4

      - name: Bölüm ayarlarını çöz
        run: |
          case "$BUCKET" in
            turkce) out=turkce/jar;  src=sources/tr/sources.json;     multi=0; extra="" ;;
            global) out=global/jar;  src=sources/global/sources.json; multi=1; extra="" ;;
            ozel)   out=ozel/jar;    src=sources/tr/sources.json;     multi=0; extra=generated ;;
            *) echo "::error::Bilinmeyen bölüm: $BUCKET"; exit 1 ;;
          esac
          {
            echo "OUT_DIR=$out"
            echo "SOURCES_FILE=$src"
            echo "ALLOW_MULTILANG=$multi"
            echo "EXTRA_DIR=$extra"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - uses: actions/checkout@v4
        with:
          repository: Kotatsu-Redo/kotatsu-parsers-redo
          path: upstream

      - name: 'Hazırla: yama, seçim, domain onarımı ve ozel parser ekleme'
        run: |
          MODE_ARG="$MODE"
          EXTRA_ARGS=""
          if [ "$BUCKET" = "ozel" ]; then MODE_ARG=none; fi
          if [ -n "$EXTRA_DIR" ]; then EXTRA_ARGS="--extra-parsers $EXTRA_DIR"; fi
          python scripts/jar_prepare.py \
            --upstream upstream \
            --sources "$SOURCES_FILE" \
            --mode "$MODE_ARG" \
            --include-broken "$INCLUDE_BROKEN" \
            --apply-alternatives "$APPLY_ALTERNATIVES" \
            --include-unverified "$INCLUDE_UNVERIFIED" \
            --allow-multilang "$ALLOW_MULTILANG" \
            $EXTRA_ARGS \
            --report data/jar_prepare.json

      - name: Yayınlanacak kaynak var mı
        id: count
        run: |
          has=$(python3 -c 'import json; p=json.load(open("data/jar_prepare.json", encoding="utf-8")); print(1 if p.get("kept_ids") else 0)')
          echo "has=$has" >> "$GITHUB_OUTPUT"
          if [ "$has" = "0" ]; then echo "Yayınlanabilir kaynak yok; dizin boş index ile yazılacak."; fi

      - name: 'Karar ver: derleme gerekiyor mu'
        id: decide
        if: steps.count.outputs.has == '1'
        run: |
          python scripts/jar_publish.py decide \
            --upstream upstream \
            --prepare data/jar_prepare.json \
            --info "$OUT_DIR/build_info.json" \
            --force "$FORCE"

      - name: JDK 17
        if: steps.decide.outputs.build == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Derle (yedek yol dahil)
        id: build
        if: steps.decide.outputs.build == 'true'
        run: |
          EXTRA_ARGS=""
          if [ -n "$EXTRA_DIR" ]; then EXTRA_ARGS="--extra-parsers $EXTRA_DIR"; fi
          if (cd upstream && chmod +x gradlew && ./gradlew jar --no-daemon); then
            echo "Derleme başarılı."
            echo "fallback=0" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Derleme başarısız; yalnızca yamalarla yedek yol deneniyor."
            rm -rf upstream
            git clone --depth 1 https://github.com/Kotatsu-Redo/kotatsu-parsers-redo.git upstream
            python scripts/jar_prepare.py --upstream upstream --patch-only $EXTRA_ARGS \
              --sources "$SOURCES_FILE" --include-unverified "$INCLUDE_UNVERIFIED"
            (cd upstream && chmod +x gradlew && ./gradlew jar --no-daemon)
            echo "fallback=1" >> "$GITHUB_OUTPUT"
          fi

      - name: D8 ile dex üret ve plugin.jar paketle
        if: steps.decide.outputs.build == 'true'
        run: |
          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "::error::ANDROID_HOME tanımlı değil"
            exit 1
          fi
          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME"/build-tools/* | tail -1)
          D8_PATH="$BUILD_TOOLS_DIR/d8"
          ANDROID_JAR="$ANDROID_HOME/platforms/android-34/android.jar"
          if [ ! -f "$ANDROID_JAR" ]; then
            echo "::error::android.jar bulunamadı: $ANDROID_JAR"
            exit 1
          fi
          mkdir -p dex
          "$D8_PATH" --release --lib "$ANDROID_JAR" --output dex upstream/build/libs/*.jar
          (cd dex && jar cvf ../plugin.jar classes.dex)

      - name: Dizini ve bölüm klasörünü yaz
        if: steps.count.outputs.has == '0' || steps.decide.outputs.build == 'true'
        env:
          FALLBACK: ${{ steps.build.outputs.fallback || '0' }}
        run: |
          python scripts/jar_publish.py index \
            --bucket "$BUCKET" \
            --prepare data/jar_prepare.json \
            --jar plugin.jar \
            --out "$OUT_DIR" \
            --run-number "${{ github.run_number }}" \
            --fallback "$FALLBACK" \
            --sources "$SOURCES_FILE"

      - name: Bölüm klasörünü dala gönder
        if: (steps.count.outputs.has == '0' || steps.decide.outputs.build == 'true') && env.PUBLISH == 'true'
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "pulsar-trmangahub-bot"
          git config user.email "pulsar-trmangahub-bot@users.noreply.github.com"
          git add "$OUT_DIR"
          if git diff --cached --quiet; then
            echo "Değişiklik yok, commit atılmadı."
            exit 0
          fi
          git commit -m "chore(jar): ${BUCKET} eklenti güncellendi"
          for i in 1 2 3; do
            git pull --rebase origin "${BRANCH}" && git push origin "HEAD:${BRANCH}" && exit 0
            sleep $((i*5))
          done
          echo "Push başarısız oldu" >&2
          exit 1

      - name: Jar raporu
        if: always()
        env:
          JAR_BUCKET: ${{ env.BUCKET }}
          JAR_BUILD: ${{ steps.decide.outputs.build }}
          JAR_REASON: ${{ steps.decide.outputs.reason }}
          JAR_BUILD_OUTCOME: ${{ steps.build.outcome }}
          JAR_FALLBACK: ${{ steps.build.outputs.fallback }}
          JAR_MODE: ${{ env.MODE }}
          JAR_INCLUDE_BROKEN: ${{ env.INCLUDE_BROKEN }}
          JAR_APPLY_ALTERNATIVES: ${{ env.APPLY_ALTERNATIVES }}
          JAR_INCLUDE_UNVERIFIED: ${{ env.INCLUDE_UNVERIFIED }}
          JAR_FORCE: ${{ env.FORCE }}
          JAR_PUBLISH: ${{ env.PUBLISH }}
        run: python scripts/report.py jar

      - name: Artefaktları yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jar-build-${{ matrix.bucket }}
          path: |
            plugin.jar
            data/jar_prepare.json
          retention-days: 7
          if-no-files-found: ignore

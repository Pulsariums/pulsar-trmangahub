name: 'Jar derle: Kototoro JAR deposu (tr, tr-nsfw, global, global-nsfw)'

on:
  schedule:
    - cron: '47 */6 * * *'
  workflow_dispatch:
    inputs:
      bolum:
        description: 'Derlenecek paket: hepsi, tr (Türkçe), tr_nsfw (Türkçe NSFW), global (Türkçe hariç), global_nsfw (Türkçe hariç NSFW)'
        type: choice
        options: [hepsi, tr, tr_nsfw, global, global_nsfw]
        default: hepsi
      mode:
        description: 'Seçim modu: alive (yayındaki/çalışan) veya all_tr (tüm TR kaynaklar; yalnız tr ve tr_nsfw için anlamlı, global paketlerde daima alive)'
        type: choice
        options: ['alive', 'all_tr']
        default: 'alive'
      include_broken:
        description: 'Bozuk (broken) kaynakları da dahil et'
        type: boolean
        default: false
      apply_alternatives:
        description: 'Alternatif domain yaması güven seviyesi'
        type: choice
        options: ['off', 'high', 'high_medium']
        default: 'high'
      include_unverified:
        description: 'cf_protected, failing ve doğrulanamamış kaynakları da dahil et (varsayılan: yalnızca çalışanlar)'
        type: boolean
        default: false
      force:
        description: 'Parmak izi aynı olsa da derle'
        type: boolean
        default: false
      publish:
        description: 'Derlemeyi jar/ klasöründe commit edip gönder'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: sync-tr-sources
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      buckets: ${{ steps.plan.outputs.buckets }}
    steps:
      - name: Paket listesini çıkar
        id: plan
        env:
          BOLUM: ${{ inputs.bolum || 'hepsi' }}
        run: |
          case "$BOLUM" in
            hepsi) list='["tr","tr_nsfw","global","global_nsfw"]' ;;
            tr|tr_nsfw|global|global_nsfw) list="[\"$BOLUM\"]" ;;
            *) echo "::error::Bilinmeyen paket: $BOLUM"; exit 1 ;;
          esac
          echo "buckets=$list" >> "$GITHUB_OUTPUT"

  jar:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        bucket: ${{ fromJSON(needs.plan.outputs.buckets) }}
    env:
      BUCKET: ${{ matrix.bucket }}
      MODE: ${{ inputs.mode || 'alive' }}
      INCLUDE_BROKEN: ${{ inputs.include_broken && '1' || '0' }}
      APPLY_ALTERNATIVES: ${{ inputs.apply_alternatives || 'high' }}
      INCLUDE_UNVERIFIED: ${{ inputs.include_unverified && '1' || '0' }}
      FORCE: ${{ inputs.force && '1' || '0' }}
      PUBLISH: ${{ inputs.publish || github.event_name == 'schedule' }}
    steps:
      - uses: actions/checkout@v4

      - name: Paket ayarlarını çöz
        run: |
          case "$BUCKET" in
            tr)          src=sources/tr/sources.json;     multi=0; nsfw=none; excl="";   extra=generated ;;
            tr_nsfw)     src=sources/tr/sources.json;     multi=0; nsfw=only; excl="";   extra=generated ;;
            global)      src=sources/global/sources.json; multi=1; nsfw=none; excl=tr; extra="" ;;
            global_nsfw) src=sources/global/sources.json; multi=1; nsfw=only; excl=tr; extra="" ;;
            *) echo "::error::Bilinmeyen paket: $BUCKET"; exit 1 ;;
          esac
          {
            echo "OUT_DIR=jar"
            echo "SOURCES_FILE=$src"
            echo "ALLOW_MULTILANG=$multi"
            echo "EXTRA_DIR=$extra"
            echo "NSFW_MODE=$nsfw"
            echo "EXCLUDE_LANG=$excl"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - uses: actions/checkout@v4
        with:
          repository: Kotatsu-Redo/kotatsu-parsers-redo
          path: upstream

      - name: 'Hazırla: yama, seçim, domain onarımı ve özel parser ekleme'
        run: |
          MODE_ARG="$MODE"
          case "$BUCKET" in global|global_nsfw) MODE_ARG=alive ;; esac
          EXTRA_ARGS=""
          if [ -n "$EXTRA_DIR" ]; then EXTRA_ARGS="--extra-parsers $EXTRA_DIR"; fi
          EXCLUDE_ARGS=""
          if [ -n "$EXCLUDE_LANG" ]; then EXCLUDE_ARGS="--exclude-lang $EXCLUDE_LANG"; fi
          python scripts/jar_prepare.py \
            --upstream upstream \
            --sources "$SOURCES_FILE" \
            --mode "$MODE_ARG" \
            --include-broken "$INCLUDE_BROKEN" \
            --apply-alternatives "$APPLY_ALTERNATIVES" \
            --include-unverified "$INCLUDE_UNVERIFIED" \
            --allow-multilang "$ALLOW_MULTILANG" \
            --nsfw "$NSFW_MODE" \
            $EXTRA_ARGS \
            $EXCLUDE_ARGS \
            --report data/jar_prepare.json

      - name: Yayınlanacak kaynak var mı
        id: count
        run: |
          has=$(python3 -c 'import json; p=json.load(open("data/jar_prepare.json", encoding="utf-8")); print(1 if p.get("kept_ids") else 0)')
          echo "has=$has" >> "$GITHUB_OUTPUT"
          if [ "$has" = "0" ]; then echo "Yayınlanabilir kaynak yok; paket indeksten çıkarılacak."; fi

      - name: 'Karar ver: derleme gerekiyor mu'
        id: decide
        if: steps.count.outputs.has == '1'
        run: |
          python scripts/jar_publish.py decide \
            --upstream upstream \
            --prepare data/jar_prepare.json \
            --info "$OUT_DIR/state/$BUCKET.build_info.json" \
            --force "$FORCE"

      - name: JDK 17
        if: steps.decide.outputs.build == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Derle (yedek yol dahil)
        id: build
        if: steps.decide.outputs.build == 'true'
        run: |
          EXTRA_ARGS=""
          if [ -n "$EXTRA_DIR" ]; then EXTRA_ARGS="--extra-parsers $EXTRA_DIR"; fi
          EXCLUDE_ARGS=""
          if [ -n "$EXCLUDE_LANG" ]; then EXCLUDE_ARGS="--exclude-lang $EXCLUDE_LANG"; fi
          if (cd upstream && chmod +x gradlew && ./gradlew jar --no-daemon); then
            echo "Derleme başarılı."
            echo "fallback=0" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Seçimli derleme başarısız. Seçilmemiş (tüm parserları içeren) jar yayımlanmaz."
            exit 1
          fi

      - name: D8 ile dex üret ve plugin.jar paketle
        if: steps.decide.outputs.build == 'true'
        run: |
          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "::error::ANDROID_HOME tanımlı değil"
            exit 1
          fi
          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME"/build-tools/* | tail -1)
          D8_PATH="$BUILD_TOOLS_DIR/d8"
          ANDROID_JAR="$ANDROID_HOME/platforms/android-34/android.jar"
          if [ ! -f "$ANDROID_JAR" ]; then
            echo "::error::android.jar bulunamadı: $ANDROID_JAR"
            exit 1
          fi
          mkdir -p dex
          "$D8_PATH" --release --lib "$ANDROID_JAR" --output dex upstream/build/libs/*.jar
          (cd dex && jar cvf ../plugin.jar classes.dex)

      - name: Paketi ve indeksi yaz
        if: steps.count.outputs.has == '0' || steps.decide.outputs.build == 'true'
        env:
          FALLBACK: ${{ steps.build.outputs.fallback || '0' }}
        run: |
          python scripts/jar_publish.py index \
            --bucket "$BUCKET" \
            --prepare data/jar_prepare.json \
            --jar plugin.jar \
            --out "$OUT_DIR" \
            --run-number "${{ github.run_number }}" \
            --fallback "$FALLBACK" \
            --sources "$SOURCES_FILE"

      - name: jar/ klasörünü dala gönder
        if: (steps.count.outputs.has == '0' || steps.decide.outputs.build == 'true') && env.PUBLISH == 'true'
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "pulsar-trmangahub-bot"
          git config user.email "pulsar-trmangahub-bot@users.noreply.github.com"
          # Paralel paket işleri aynı index.min.json dosyasını değiştirir; çakışmayı
          # rebase ile çözmek yerine kendi dosyalarımızı yedekleyip güncel dalın
          # üstüne yeniden uygular, indeksi state/*.entry.json'dan baştan üretiriz.
          SAVE="$(mktemp -d)"
          mkdir -p "$SAVE/state" "$SAVE/apk"
          cp jar/state/${BUCKET}.* "$SAVE/state/"
          cp -r jar/apk/. "$SAVE/apk/"
          for i in 1 2 3 4 5 6; do
            git fetch origin "${BRANCH}"
            git reset --hard "origin/${BRANCH}"
            mkdir -p jar/state jar/apk
            cp "$SAVE"/state/* jar/state/
            cp -r "$SAVE"/apk/. jar/apk/
            python scripts/jar_publish.py merge-index --out jar
            python scripts/jar_publish.py readme --out jar
            git add jar
            if git diff --cached --quiet; then
              echo "Değişiklik yok, commit atılmadı."
              exit 0
            fi
            git commit -m "chore(jar): ${BUCKET} paketi güncellendi"
            git push origin "HEAD:${BRANCH}" && exit 0
            sleep $((i*4))
          done
          echo "Push başarısız oldu" >&2
          exit 1

      - name: Jar raporu
        if: always()
        env:
          JAR_BUCKET: ${{ env.BUCKET }}
          JAR_BUILD: ${{ steps.decide.outputs.build }}
          JAR_REASON: ${{ steps.decide.outputs.reason }}
          JAR_BUILD_OUTCOME: ${{ steps.build.outcome }}
          JAR_FALLBACK: ${{ steps.build.outputs.fallback }}
          JAR_MODE: ${{ env.MODE }}
          JAR_INCLUDE_BROKEN: ${{ env.INCLUDE_BROKEN }}
          JAR_APPLY_ALTERNATIVES: ${{ env.APPLY_ALTERNATIVES }}
          JAR_INCLUDE_UNVERIFIED: ${{ env.INCLUDE_UNVERIFIED }}
          JAR_FORCE: ${{ env.FORCE }}
          JAR_PUBLISH: ${{ env.PUBLISH }}
        run: python scripts/report.py jar

      - name: Artefaktları yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jar-build-${{ matrix.bucket }}
          path: |
            plugin.jar
            data/jar_prepare.json
          retention-days: 7
          if-no-files-found: ignore

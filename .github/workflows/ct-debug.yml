name: CT Debug
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          curl -sS -m 60 -o /tmp/a -w 'crt.sh: %{http_code}\n' 'https://crt.sh/?q=%25siyahmelek%25&output=json'; head -c 300 /tmp/a; echo
          curl -sS -m 60 -o /tmp/b -w 'certspotter: %{http_code}\n' 'https://api.certspotter.com/v1/issuances?domain=siyahmelek.my&include_subdomains=true&expand=dns_names'; head -c 300 /tmp/b; echo
          curl -sS -m 60 -o /tmp/c -w 'bing-dns: %{http_code}\n' 'https://dns.google/resolve?name=siyahmelek.my&type=A'; head -c 200 /tmp/c; echo

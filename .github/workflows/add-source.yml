name: 'Kaynak ekle: site linkinden üret'

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Manga sitesinin adresi'
        type: string
        required: true
      name:
        description: 'Kaynak adı (boş bırakılırsa domainden üretilir)'
        type: string
        required: false
        default: ''
      format:
        description: 'Üretilecek çıktı'
        type: choice
        options: ['both', 'jar', 'mihon']
        default: 'both'
      engine:
        description: 'Motor (auto: sitenin HTML parmak izinden tespit edilir)'
        type: choice
        options: ['auto', 'madara', 'mangathemesia', 'initmanga', 'custom', 'derin']
        default: 'auto'
      register:
        description: 'Depoya kaydet ve commit at'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: sync-tr-sources
  cancel-in-progress: false

jobs:
  add-source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SITE_URL: ${{ inputs.url }}
      SITE_NAME: ${{ inputs.name }}
      SITE_FORMAT: ${{ inputs.format }}
      SITE_ENGINE: ${{ inputs.engine }}
      SITE_REGISTER: ${{ inputs.register }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Collect upstream sources
        run: python scripts/sync.py

      - name: Analyze site and scaffold source
        id: analyze
        run: |
          eng="$SITE_ENGINE"; [ "$eng" = "derin" ] && eng=auto
          args=(--url "$SITE_URL" --format "$SITE_FORMAT" --engine "$eng")
          if [ -n "$SITE_NAME" ]; then args+=(--name "$SITE_NAME"); fi
          if [ "$SITE_REGISTER" = "true" ]; then args+=(--register 1); else args+=(--register 0); fi
          python scripts/analyze_site.py "${args[@]}"

      - name: Derin analiz (tarayıcı + arşiv) ve siteye özel parser
        if: always()
        run: |
          set +e
          verdict=$(jq -r '.verdict // .status // ""' data/analyze_result.json 2>/dev/null)
          if [ "$SITE_ENGINE" != "derin" ] && [ "$verdict" != "unsupported_engine" ]; then
            echo "bilinen motor ($verdict), derin analiz atlandı"; exit 0
          fi
          host=$(echo "$SITE_URL" | sed -E 's#https?://##; s#/.*##; s#^www\.##')
          npm init -y >/dev/null; npm i playwright@1.49.1 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          node scripts/recon.mjs "https://$host" || echo "recon hata verdi"
          # Arşiv: eski sürümlerdeki yol kalıpları (site yeniden yazılmış olabilir)
          curl -s -m 60 "https://web.archive.org/cdx/search/cdx?url=$host/*&output=txt&fl=original&filter=statuscode:200&collapse=urlkey&limit=400" \
            | sed -E 's#https?://[^/]+##; s#\?.*##' | awk -F/ 'NF>2{print "/"$2"/"}' | sort | uniq -c | sort -rn | head -15 > recon-out/$host.wayback.txt
          cat recon-out/$host.wayback.txt
          if [ -f "recon-out/$host.spec.json" ]; then
            nsfw=0; [ "$(jq -r '.nsfw // false' data/analyze_result.json 2>/dev/null)" = "true" ] && nsfw=1
            args=(recon-out/$host.spec.json --nsfw $nsfw)
            [ -n "$SITE_NAME" ] && args+=(--name "$SITE_NAME")
            node scripts/genparser.mjs "${args[@]}" && echo "parser üretildi"
          else
            echo "spec üretilemedi: recon çıktısı yok"
          fi
          mkdir -p data/recon
          for f in recon-out/*; do case "$f" in *.html) head -c 300000 "$f" > "data/recon/$(basename "$f")";; *) cp "$f" data/recon/;; esac; done

      - name: Run report
        if: always()
        run: python scripts/report.py add

      - name: Upload generated sources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated
          path: |
            generated/
            data/analyze_result.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit new source to the current branch
        if: inputs.register && steps.analyze.outcome == 'success'
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          domain=$(python -c 'import json; print(json.load(open("data/analyze_result.json", encoding="utf-8"))["domain"])')
          git config user.name "pulsar-trmangahub-bot"
          git config user.email "pulsar-trmangahub-bot@users.noreply.github.com"
          if [ -d sources/custom ]; then git add sources/custom; fi
          if [ -d generated ]; then git add generated; fi
          if [ -d data/recon ]; then git add -f data/recon; fi
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore(add-source): ${domain} eklendi"
          for i in 1 2 3; do
            git pull --rebase origin "${BRANCH}" && git push origin "HEAD:${BRANCH}" && exit 0
            sleep $((i*5))
          done
          echo "Push başarısız oldu" >&2
          exit 1
